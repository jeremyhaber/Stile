name: mac

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Stile.app
        run: bash mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Stile
          path: mac/dist/Stile.zip
          if-no-files-found: error
